<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bomberman · Board texture study</title>
  <link rel="stylesheet" href="preview.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">BOMBERMAN / VISUAL STUDY</p>
        <h1>Board textures</h1>
        <p class="intro">Quiet green ground, stone walls, and wooden crates.</p>
      </div>
      <div class="comparison" aria-label="Compare board textures">
        <button id="current" aria-pressed="false">Original</button>
        <button id="proposed" aria-pressed="true">Updated</button>
      </div>
    </header>
    <section class="board" aria-label="Board preview">
      <canvas id="board" width="750" height="650" aria-label="Bomberman board with player, balloons, bomb, and upgrades"></canvas>
    </section>
    <footer>
      <div class="material"><canvas id="ground" width="100" height="100" aria-label="Ground texture"></canvas><div><h2>Ground</h2><p>Subtle pixel clusters<br>and a softer green.</p></div></div>
      <div class="material"><canvas id="stone" width="100" height="100" aria-label="Stone wall texture"></canvas><div><h2>Stone</h2><p>Defined bricks<br>and a raised edge.</p></div></div>
      <div class="material"><canvas id="wood" width="100" height="100" aria-label="Wooden crate texture"></canvas><div><h2>Wood</h2><p>Visible planks<br>and a darker base.</p></div></div>
    </footer>
  </main>
  <script src="../assets.js"></script>
  <script src="../level-state.js"></script>
  <script src="../player.js"></script>
  <script src="../enemy.js"></script>
  <script src="../bomb-system.js"></script>
  <script src="../board-textures.js"></script>
    <script src="../renderer.js"></script>
  <script src="preview.js"></script>
</body>
</html>
